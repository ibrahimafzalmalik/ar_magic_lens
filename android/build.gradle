buildscript{
    ext.kotlin_version='1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.google.gms:google-services:4.3.10'
        ///classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }

    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name == "kotlin-gradle-plugin") {
                details.useVersion kotlin_version
            }
        }
    }
}



allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Configure Java toolchain to use Java 17 for compilation (avoids jlink issues)
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        options.compilerArgs += ['-Xlint:-options']
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
                // AGP 8+ requires namespace; backfill for legacy plugins.
                if (namespace == null || namespace.toString().trim().isEmpty()) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestText = manifestFile.getText('UTF-8')
                        def packageMatcher = manifestText =~ /package\s*=\s*"([^"]+)"/
                        if (packageMatcher.find()) {
                            namespace = packageMatcher.group(1)
                        }
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
                if (hasProperty("kotlinOptions")) {
                    kotlinOptions {
                        jvmTarget = "11"
                    }
                }
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "11"
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


